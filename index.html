<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Mon agenda &amp; mes finances</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#14201a;--mu:#5b6b63;--ac:#0b8f5a;--ac2:#d9f7e8;--bd:#dce5e0;--bad:#d64545;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#111;--tx:#eef3f0;--mu:#9aa8a1;--ac:#62f0aa;--ac2:#12301f;--bd:#262b28;--bad:#ff7a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#111;--tx:#eef3f0;--mu:#9aa8a1;--ac:#62f0aa;--ac2:#12301f;--bd:#262b28;--bad:#ff7a7a;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:680px;margin:0 auto;padding:12px 12px 84px}
h2{font-size:17px;margin:16px 0 8px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row b{width:46px;color:var(--ac);font-weight:600;font-size:13px}.row span{flex:1}.dn{text-decoration:line-through;color:var(--mu)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;box-sizing:border-box}
.row input:not([type=checkbox]){flex:1;border:0;background:transparent;padding:4px 0;min-width:0}.row input[type=checkbox]{width:20px;height:20px}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
.chips{display:flex;gap:5px;margin:10px 0}.chips button{flex:1;padding:8px 0}.chips .on,.btns .pri{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
.btns,.add{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.add input{flex:1}.bad{color:var(--bad)}.x{border:0;background:none;color:var(--mu);padding:4px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .card{padding:12px;margin:0}.big{font-size:26px;font-weight:700;color:var(--ac)}
.sc{overflow-x:auto}table{border-collapse:collapse;font-size:13px;width:100%}th,td{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);text-align:left;padding-left:10px}
.am{width:74px;padding:4px;text-align:right}.st{padding:4px 7px;font-size:12px;min-width:50px;color:var(--mu)}.st.ok{background:var(--ac2);color:var(--ac);border-color:var(--ac)}.st.neant{color:var(--mu);border-style:dashed;text-decoration:line-through}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.sum div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.sum b{display:block;font-size:15px}
.pos{color:var(--ac)}.neg{color:var(--bad)}details{margin:10px 0}summary{cursor:pointer;color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--mu);font-size:12px}nav .on{color:var(--ac);font-weight:700}.bn{background:var(--ac2);border:1px solid var(--ac);border-radius:12px;padding:10px 12px;margin-bottom:10px}.bn b{color:var(--ac)}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal button{padding:8px 0;position:relative;border-color:transparent;background:none}.cal .h{color:var(--mu);font-size:12px;padding:4px 0}.cal .sel{background:var(--ac);color:var(--bg);font-weight:700}.cal .td{border-color:var(--ac)}.cal i{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}.cal .sel i{background:var(--bg)}.past{opacity:.45}.now b,.now span{color:var(--ac);font-weight:700}.late{color:var(--bad)}small.mu{font-size:12px}
</style></head><body>
<div id="bn"></div><div id="app"></div>
<nav id="nav"></nav>
<script>
const D=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"],DL=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const M=[["Sept",9],["Oct",10],["Nov",11],["Déc",12],["Janv",1],["Févr",2],["Mars",3],["Avr",4],["Mai",5],["Juin",6]];
const TM=[];for(let h=8;h<=18;h++){const p=(h<10?"0":"")+h;TM.push(p+":00",p+":30")}
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");const K="agenda-finances-v1";let S,tab="today",cf="",day=(new Date().getDay()+6)%7,mois=new Date().toISOString().slice(0,7),cd=iso(new Date()),cy=new Date().getFullYear(),cmn=new Date().getMonth();
const mk=a=>{const o={};a.forEach(([d,t,x])=>o[d+"|"+t]=x);return o};
function seed(){return{active:"p1",plans:[{id:"p1",name:"Cours 2026-2027",slots:{}}],fam:[],pay:{},ops:[],tasks:[],notes:""}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();mig();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const P=()=>S.plans.find(p=>p.id===S.active)||S.plans[0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("fr-FR")+" F",fk=n=>n?(n/1000)+"K":"–",$=i=>document.getElementById(i);
function vToday(){const n=new Date(),di=(n.getDay()+6)%7,p=P(),mo=n.getMonth()+1,cm=M.find(m=>m[1]===mo);
const nm=n.getHours()*60+n.getMinutes(),it=TL=dayItems(iso(n)),nx=it.find(x=>x.m>=nm),rows=it.map((x,i)=>`<div class="row ${x.m+60<=nm?"past":x.m<=nm?"now":""}"><b>${x.t}</b><span>${esc(x.l)}${x.k==="rdv"?" 📌":""}</span>${x.k==="cours"?`<button class="x" onclick="fromLesson(${i})">📝</button>`:""}</div>`).join("")||`<p class="mu" style="padding:0 12px">Aucun cours aujourd’hui.</p>`;
const unp=cm?S.fam.filter(f=>!S.pay[f.id+"|"+mo]).length:"–";
return `<h2>${DL[di]} ${n.getDate()} ${n.toLocaleDateString("fr-FR",{month:"long"})}</h2><p class="mu">Planning actif : ${esc(p.name)}${nx?" · Prochain : "+nx.t+" "+esc(nx.l)+" (dans "+dl(nx.m-nm)+")":""}</p><div class="card">${rows}</div>
<div class="grid2"><div class="card"><div class="mu">Paiements à saisir (ce mois)</div><div class="big">${unp}</div></div><div class="card"><div class="mu">Tâches ouvertes</div><div class="big">${S.tasks.filter(t=>!t.done).length}</div></div></div>${hwToday(it)}${todayExtra(n)}`}
function vPlan(){const p=P(),names=[...new Set(S.plans.flatMap(q=>Object.values(q.slots)))];
const seg=`<div class="chips" style="margin-top:8px"><button class="${pw==="j"?"on":""}" onclick="pw='j';r()">Par jour</button><button class="${pw==="r"?"on":""}" onclick="pw='r';r()">Récap. par élève</button></div>`;
const body=pw==="r"?recap():`<div class="chips">${D.map((x,i)=>`<button class="${i===day?"on":""}" onclick="day=${i};r()">${x}</button>`).join("")}</div><datalist id="nm">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist><div class="card">${TM.map(t=>`<label class="row"><b>${t}</b><input list="nm" value="${esc(p.slots[day+"|"+t]||"")}" placeholder="—" onchange="setSlot('${t}',this.value)"></label>`).join("")}</div>`;
return `<select onchange="S.active=this.value;save();r()">${S.plans.map(q=>`<option value="${q.id}"${q.id===p.id?" selected":""}>${esc(q.name)}</option>`).join("")}</select>`+seg+body+`<details><summary>Gérer les plannings (congés, nouvelle période…)</summary><input id="pn" placeholder="Nom (ex. Congés de Noël)"><div class="btns"><button onclick="newPlan(1)">Dupliquer l’actuel</button><button onclick="newPlan(0)">Planning vide</button><button class="bad" onclick="delPlan()">${cf==="plan"?"Confirmer ?":"Supprimer l’actuel"}</button></div></details>`}
function recap(){const m={};Object.entries(P().slots).forEach(([k,v])=>{const[d,t]=k.split("|");SN(v).forEach(n=>{const q=nk(n);(m[q]=m[q]||{n:S.stu.find(x=>nk(x)===q)||n,a:[]}).a.push([+d,t])})});
const R=Object.values(m).sort((a,b)=>a.n.localeCompare(b.n));
return `<h2>Programme de chaque élève</h2><div class="card">${R.map(e=>{const a=e.a.sort((x,y)=>x[0]-y[0]||x[1].localeCompare(y[1]));return `<div class="row"><b style="width:84px;color:inherit">${esc(e.n)}</b><span class="mu">${a.map(x=>D[x[0]]+" "+x[1]).join(" · ")}</span><small>${a.length}×</small></div>`}).join("")||`<p class="mu" style="padding:0 12px">Aucun cours dans ce planning.</p>`}</div><p class="mu">${R.length} élève${R.length>1?"s":""} · ${Object.keys(P().slots).length} créneaux par semaine · planning « ${esc(P().name)} ».</p>`}
function setSlot(t,v){v=v.trim();const k=day+"|"+t;if(v)P().slots[k]=v;else delete P().slots[k];save()}
function newPlan(c){const id="p"+Date.now();S.plans.push({id,name:$("pn").value.trim()||"Nouveau planning",slots:c?{...P().slots}:{}});S.active=id;save();r()}
function delPlan(){if(S.plans.length<2)return;if(cf!=="plan"){cf="plan";r();return}S.plans=S.plans.filter(q=>q.id!==S.active);S.active=S.plans[0].id;cf="";save();r()}
function pstat(){const mo=+mois.slice(5),inM=M.some(m=>m[1]===mo),pd=f=>S.pay[f.id+"|"+mo];return{mo,inM,sco:inM?S.fam.filter(f=>pd(f)==="ok").reduce((a,f)=>a+f.amt,0):0,rst:inM?S.fam.filter(f=>!pd(f)).reduce((a,f)=>a+f.amt,0):0,nn:inM?S.fam.filter(f=>pd(f)==="neant").length:0}}
function vPay(){return `<div class="chips" style="margin-top:0"><button class="${pv==="p"?"on":""}" onclick="pv='p';r()">Paie des parents</button><button class="${pv==="f"?"on":""}" onclick="pv='f';r()">Finances du mois</button></div>`+(pv==="p"?vParents():vFin())}
function vParents(){const{sco,rst,nn}=pstat(),pd=(f,m)=>S.pay[f.id+"|"+m];
return `<h2>Paie des parents</h2><input type="month" value="${mois}" onchange="mois=this.value||mois;r()"><div class="sum"><div>Encaissé<b class="pos">${fmt(sco)}</b></div><div>À saisir<b>${fmt(rst)}</b></div><div>NÉANT<b>${nn}</b></div></div>
<div class="card sc"><table><tr><th>Famille</th><th>Montant</th>${M.map(m=>`<th>${m[0]}</th>`).join("")}</tr>${S.fam.map(f=>`<tr><td>${esc(f.name)} <button class="x" onclick="delFam('${f.id}')">${cf===f.id?"Confirmer ?":"✕"}</button></td><td><input class="am" type="number" inputmode="numeric" value="${f.amt}" onchange="setAmt('${f.id}',this.value)"></td>${M.map(m=>{const s=pd(f,m[1]);return `<td><button class="st ${s||""}" onclick="cyc('${f.id}',${m[1]})">${s==="ok"?"OK":s==="neant"?"NÉANT":"·"}</button></td>`}).join("")}</tr>`).join("")}<tr><td><b>Encaissé</b></td><td></td>${M.map(m=>`<td>${fk(S.fam.filter(f=>pd(f,m[1])==="ok").reduce((a,f)=>a+f.amt,0))}</td>`).join("")}</tr></table></div>
<p class="mu">Touche une case : · (à saisir) → OK (payé) → NÉANT (pas de paie ce mois-ci, exclu des totaux).</p>
<div class="add"><input id="fn" placeholder="Nouvelle famille"><input id="fa" type="number" inputmode="numeric" placeholder="Montant" style="max-width:110px"><button onclick="addFam()">Ajouter</button></div>`}
function vFin(){const{sco}=pstat(),inc=S.fin.inc,ops=S.ops.filter(o=>o.date.slice(0,7)===mois).sort((a,b)=>b.date.localeCompare(a.date)),rev=ops.filter(o=>o.type==="r").reduce((a,o)=>a+o.amt,0)+(inc?sco:0),dep=ops.filter(o=>o.type==="d").reduce((a,o)=>a+o.amt,0),sd=rev-dep;
return `<h2>Finances du mois</h2><input type="month" value="${mois}" onchange="mois=this.value||mois;r()">
<div class="sum"><div>Revenus<b class="pos">${fmt(rev)}</b></div><div>Dépenses<b class="neg">${fmt(dep)}</b></div><div>Solde<b class="${sd<0?"neg":"pos"}">${fmt(sd)}</b></div></div>
<label class="row" style="padding:6px 0;border:0"><input type="checkbox"${inc?" checked":""} onchange="S.fin.inc=this.checked;save();r()"><span class="mu">Inclure la paie encaissée des parents (${fmt(sco)})</span></label>
<div class="add"><select id="ot" style="max-width:110px"><option value="d">Dépense</option><option value="r">Revenu</option></select><input id="ol" placeholder="Libellé"></div>
<div class="add"><input id="oa" type="number" inputmode="numeric" placeholder="Montant"><input id="od" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="pri" onclick="addOp()">Ajouter</button></div>
<div class="card">${ops.map(o=>`<div class="row"><b>${o.date.slice(8)}/${o.date.slice(5,7)}</b><span>${esc(o.label)}</span><span class="${o.type==="r"?"pos":"neg"}" style="flex:none">${o.type==="r"?"+":"−"}${fmt(o.amt)}</span><button class="x" onclick="S.ops=S.ops.filter(x=>x.id!=='${o.id}');save();r()">✕</button></div>`).join("")||`<p class="mu" style="padding:0 12px">Aucune opération ce mois-ci.</p>`}</div>`}
function cyc(id,m){const k=id+"|"+m,c=S.pay[k];if(!c)S.pay[k]="ok";else if(c==="ok")S.pay[k]="neant";else delete S.pay[k];save();r()}
function setAmt(id,v){S.fam.find(f=>f.id===id).amt=+v||0;save();r()}
function addFam(){const n=$("fn").value.trim();if(!n)return;S.fam.push({id:"f"+Date.now(),name:n,amt:+$("fa").value||0});save();r()}
function delFam(id){if(cf!==id){cf=id;r();return}S.fam=S.fam.filter(f=>f.id!==id);cf="";save();r()}
function addOp(){const a=+$("oa").value;if(!a)return;S.ops.push({id:"o"+Date.now(),type:$("ot").value,label:$("ol").value.trim()||"Sans libellé",amt:a,date:$("od").value||new Date().toISOString().slice(0,10)});save();r()}
function vTasks(){return `<h2>Tâches à effectuer</h2><div class="card">${S.tasks.map((t,i)=>`<div class="row"><input type="checkbox"${t.done?" checked":""} onchange="S.tasks[${i}].done=this.checked;save();r()"><span class="${t.done?"dn":""}">${esc(t.t)}${t.due?` <small class="${!t.done&&t.due<iso(new Date())?"late":"mu"}">· ${t.due.slice(8)}/${t.due.slice(5,7)}</small>`:""}</span><button class="x" onclick="S.tasks.splice(${i},1);save();r()">✕</button></div>`).join("")||`<p class="mu" style="padding:0 12px">Rien à faire pour l’instant.</p>`}</div>
<div class="add"><input id="nt" placeholder="Nouvelle tâche"><input id="ntd" type="date" style="max-width:150px"><button class="pri" onclick="addT()">Ajouter</button></div>
<h2>Remarques</h2><textarea rows="4" onchange="S.notes=this.value;save()">${esc(S.notes)}</textarea>
<h2>Sauvegarde</h2><p class="mu">Tes données restent sur ce téléphone. Exporte-les de temps en temps et garde le texte en lieu sûr (message à toi-même, par exemple).</p>
<textarea id="bk" rows="3" placeholder="Texte de sauvegarde"></textarea><div class="btns"><button onclick="ex()">Exporter</button><button onclick="im()">Importer</button></div><p class="mu">IK Planning · version 3</p>`}
function addT(){const v=$("nt").value.trim();if(!v)return;S.tasks.push({t:v,done:false,due:$("ntd").value});save();r()}
function ex(){const b=$("bk");b.value=JSON.stringify(S);b.select();try{navigator.clipboard.writeText(b.value)}catch(e){}}
function im(){try{const v=JSON.parse($("bk").value);if(v&&v.plans&&v.fam){S=v;mig();save();r();return}}catch(e){}$("bk").value="";$("bk").placeholder="Sauvegarde invalide"}
const tm=t=>parseInt(t.slice(0,2))*60+parseInt(t.slice(3)),dl=m=>m<60?m+" min":Math.floor(m/60)+" h"+(m%60?" "+m%60:""),p2=n=>String(n).padStart(2,"0");let fired={},TL=[],cs="",cp=null,sm=iso(new Date()).slice(0,7),pv="p",cv="s",pw="j",op={};
function dayItems(ds){const di=(new Date(ds+"T12:00").getDay()+6)%7,p=P(),a=[];TM.forEach(t=>{const x=p.slots[di+"|"+t];if(x)a.push({t,m:tm(t),l:x,k:"cours"})});S.ev.filter(e=>e.date===ds).forEach(e=>a.push({t:e.time,m:tm(e.time),l:e.title,k:"rdv",id:e.id}));return a.sort((x,y)=>x.m-y.m)}
function vAgenda(){const f=new Date(cy,cmn,1),off=(f.getDay()+6)%7,nd=new Date(cy,cmn+1,0).getDate(),ti=iso(new Date());let c=D.map(x=>`<div class="h">${x[0]}</div>`).join("");for(let i=0;i<off;i++)c+="<div></div>";for(let d=1;d<=nd;d++){const ds=cy+"-"+p2(cmn+1)+"-"+p2(d);c+=`<button class="${ds===cd?"sel":ds===ti?"td":""}" onclick="cd='${ds}';r()">${d}${S.ev.some(e=>e.date===ds)?"<i></i>":""}</button>`}
return `<div class="add" style="justify-content:space-between;align-items:center;flex-wrap:nowrap"><button onclick="mv(-1)">‹</button><b>${f.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</b><button onclick="mv(1)">›</button></div><div class="card" style="padding:8px"><div class="cal">${c}</div></div><h2>${new Date(cd+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</h2><div class="card">${dayItems(cd).map(x=>`<div class="row"><b>${x.t}</b><span>${esc(x.l)}${x.k==="rdv"?" 📌":""}</span>${x.id?`<button class="x" onclick="delEv('${x.id}')">✕</button>`:""}</div>`).join("")||`<p class="mu" style="padding:0 12px">Rien de prévu ce jour-là.</p>`}</div><div class="add"><input id="et" placeholder="Rendez-vous, réunion, événement…"></div><div class="add"><input id="ed" type="date" value="${cd}"><input id="eh" type="time" value="09:00" style="max-width:120px"><button class="pri" onclick="addEv()">Ajouter</button></div><p class="mu">Les cours viennent du planning actif. Les rendez-vous ajoutés ici déclenchent aussi un rappel.</p>`}
function mv(n){cmn+=n;if(cmn<0){cmn=11;cy--}if(cmn>11){cmn=0;cy++}r()}
function addEv(){const t=$("et").value.trim();if(!t)return;const d=$("ed").value||cd;S.ev.push({id:"e"+Date.now(),title:t,date:d,time:$("eh").value||"09:00"});cd=d;cy=+d.slice(0,4);cmn=+d.slice(5,7)-1;save();r()}
function delEv(id){S.ev=S.ev.filter(e=>e.id!==id);save();r()}
function todayExtra(n){const ds=iso(n),k=i=>new Date(n.getFullYear(),n.getMonth(),n.getDate()+i),row=x=>`<div class="row"><b>${x.t}</b><span>${esc(x.l)}${x.k==="rdv"?" 📌":""}</span></div>`,tom=dayItems(iso(k(1))).map(row).join(""),a=[];for(let i=2;i<=7;i++){const d=k(i);S.ev.filter(e=>e.date===iso(d)).forEach(e=>a.push(`<div class="row"><b>${p2(d.getDate())}/${p2(d.getMonth()+1)}</b><span>${e.time} · ${esc(e.title)} 📌</span></div>`))}
const tk=S.tasks.filter(t=>!t.done&&t.due&&t.due<=ds).map(t=>`<div class="row"><span class="${t.due<ds?"late":""}">${esc(t.t)}${t.due<ds?" (en retard)":""}</span></div>`).join("");
return (tk?`<h2>À faire aujourd’hui</h2><div class="card">${tk}</div>`:"")+(tom?`<h2>Demain</h2><div class="card">${tom}</div>`:"")+(a.length?`<h2>À venir</h2><div class="card">${a.join("")}</div>`:"")+`<details><summary>Réglages des rappels</summary><p class="mu">Une alerte s’affiche en haut de l’écran avant chaque cours ou rendez-vous, tant que l’application est ouverte.</p><select onchange="setLead(this.value)">${[10,15,30,60].map(v=>`<option value="${v}"${v===S.cfg.lead?" selected":""}>Me prévenir ${v} min avant</option>`).join("")}</select><div class="btns"><button onclick="askN()">${S.cfg.notif?"Notifications activées ✓":"Activer les notifications"}</button></div></details>`}
function setLead(v){S.cfg.lead=+v;save();r()}
function askN(){try{Notification.requestPermission().then(p=>{S.cfg.notif=p==="granted";save();r()})}catch(e){}}
function tick(){const n=new Date(),nm=n.getHours()*60+n.getMinutes(),ds=iso(n);let h="";dayItems(ds).filter(x=>x.m>=nm&&x.m-nm<=S.cfg.lead).forEach(x=>{h+=`<div class="bn">⏰ <b>${x.m===nm?"Maintenant":"Dans "+dl(x.m-nm)}</b> · ${x.t} · ${esc(x.l)}</div>`;const k=ds+x.t+x.l;if(S.cfg.notif&&!fired[k]){fired[k]=1;try{navigator.serviceWorker.ready.then(r=>r.showNotification(x.k==="rdv"?"Rappel":"Cours",{body:x.t+" · "+x.l,icon:"icon-192.png"}))}catch(e){}}});const late=S.tasks.filter(t=>!t.done&&t.due&&t.due<ds).length;if(late)h+=`<div class="bn">📝 <b>${late}</b> tâche${late>1?"s":""} en retard</div>`;const ex=S.ex.filter(e=>!e.done&&e.due&&e.due<=ds).length;if(ex)h+=`<div class="bn">📚 <b>${ex}</b> série${ex>1?"s":""} d’exercices à corriger</div>`;$("bn").innerHTML=h}
setInterval(()=>{if(tab==="today")r();else tick()},30000);
const LS={ok:"Effectuée",abs:"Élève absent",rep:"Reportée",ann:"Annulée"},dm=d=>d.slice(8)+"/"+d.slice(5,7),MN=m=>new Date(m+"-15T12:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"}),CV=[["s","Séances"],["x","Exercices"],["u","Suivi"],["e","Élèves"]];
function nk(n){return n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toLowerCase()}
function SN(l){return l.split(/\s*[\/,&]\s*/).map(x=>x.trim()).filter(Boolean)}
function canon(n){n=(n||"").replace(/\s+/g," ").trim();if(!n)return"";const k=nk(n),f=S.stu.find(x=>nk(x)===k);if(f)return f;S.stu.push(n);return n}
function mig(){S.cfg=S.cfg||{lead:30,notif:false};["ev","log","ex","stu"].forEach(k=>S[k]=S[k]||[]);S.arch=S.arch||{};S.fin=S.fin||{inc:false};
if(!S.v3){S.v3=1;S.log.forEach(e=>{if(e.hw)S.ex.push({id:"x"+e.id,student:e.student,sub:e.sub||"",t:e.hw,date:e.date,due:e.due||"",done:!!e.done});delete e.hw;delete e.due;delete e.done});S.plans.forEach(p=>Object.values(p.slots).forEach(v=>SN(v).forEach(canon)))}
S.log.forEach(e=>e.student=canon(e.student));S.ex.forEach(e=>e.student=canon(e.student))}
const stuOpts=()=>`<datalist id="cn">${[...S.stu].sort().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`,dt=(k,o)=>`<details${(op[k]===undefined?o:op[k])?" open":""} ontoggle="op['${k}']=this.open">`;
function rowsFor(m){const L=S.log.filter(e=>!m||e.date.slice(0,7)===m),X=S.ex.filter(e=>!m||e.date.slice(0,7)===m);return [...new Set([...L,...X].map(e=>e.student))].sort().map(s=>{const l=L.filter(e=>e.student===s),h=X.filter(e=>e.student===s);return{s,ok:l.filter(e=>e.st==="ok").length,abs:l.filter(e=>e.st==="abs").length,h:h.length,d:h.filter(e=>e.done).length}})}
const tbl=R=>`<div class="card sc"><table><tr><th>Élève</th><th>Séances</th><th>Abs.</th><th>Exos faits</th><th>En attente</th></tr>${R.map(r=>`<tr><td>${esc(r.s)}</td><td>${r.ok}</td><td>${r.abs}</td><td>${r.d}/${r.h}</td><td class="${r.h>r.d?"late":""}">${r.h-r.d}</td></tr>`).join("")||`<tr><td colspan="5" class="mu">Aucune donnée.</td></tr>`}</table></div>`;
function vCahier(){return `<div class="chips" style="margin-top:0">${CV.map(c=>`<button class="${cv===c[0]?"on":""}" onclick="cv='${c[0]}';cf='';r()">${c[1]}</button>`).join("")}</div>`+({s:vSeances,x:vExos,u:vSuivi,e:vEleves}[cv])()}
function vSeances(){const f=cp||{},t=iso(new Date()),L=S.log.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)),ms=[...new Set(L.map(e=>e.date.slice(0,7)))];
return `${stuOpts()}<h2>Nouvelle séance</h2><div class="add"><input id="le" list="cn" placeholder="Élève" value="${esc(f.student||"")}"><input id="ld" type="date" value="${f.date||t}" style="max-width:150px"></div><div class="add"><input id="lm" placeholder="Matière (ex. Maths)"><select id="lt" style="max-width:140px">${Object.entries(LS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div><textarea id="lc" rows="2" placeholder="Contenu de la séance (leçon vue, points travaillés)"></textarea><div class="btns"><button class="pri" onclick="addLog()">Enregistrer la séance</button></div>
<h2>Séances passées</h2>${ms.map(m=>{const l=L.filter(e=>e.date.slice(0,7)===m);return `${dt("s"+m,m===t.slice(0,7))}<summary>${MN(m)} <span class="mu">· ${l.length} séance${l.length>1?"s":""}</span></summary><div class="card">${l.map(e=>`<div class="row"><b>${dm(e.date)}</b><span><b style="width:auto;color:inherit">${esc(e.student)}</b>${e.sub?" · "+esc(e.sub):""} <small class="mu">· ${LS[e.st]||""}</small>${e.c?`<br><small class="mu">${esc(e.c)}</small>`:""}</span><button class="x" onclick="delLog('${e.id}')">✕</button></div>`).join("")}</div></details>`}).join("")||`<p class="mu">Aucune séance enregistrée.</p>`}`}
function vExos(){const t=iso(new Date()),f=cp||{},E=S.ex.filter(e=>!cs||e.student===cs),W=E.filter(e=>!e.done).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")),D2=E.filter(e=>e.done).sort((a,b)=>b.date.localeCompare(a.date)),row=e=>`<div class="row"><input type="checkbox"${e.done?" checked":""} onchange="tgEx('${e.id}')"><span class="${e.done?"dn":""}"><b style="width:auto;color:inherit">${esc(e.student)}</b>${e.sub?" · "+esc(e.sub):""} · ${esc(e.t)}<br><small class="${!e.done&&e.due&&e.due<t?"late":"mu"}">donné le ${dm(e.date)}${e.due?" · pour le "+dm(e.due):""}</small></span><button class="x" onclick="delEx('${e.id}')">✕</button></div>`;
return `${stuOpts()}<h2>Nouveaux exercices</h2><div class="add"><input id="xe" list="cn" placeholder="Élève" value="${esc(f.student||"")}"><input id="xm" placeholder="Matière"></div><textarea id="xt" rows="2" placeholder="Exercices donnés"></textarea><div class="add" style="margin-top:8px"><span class="mu" style="align-self:center;flex:1">Échéance (jour de la correction)</span><input id="xd" type="date" style="max-width:160px"></div><div class="btns"><button class="pri" onclick="addEx()">Enregistrer</button></div>
<h2>À corriger</h2><select onchange="cs=this.value;r()"><option value="">Tous les élèves</option>${[...S.stu].sort().map(s=>`<option${s===cs?" selected":""}>${esc(s)}</option>`).join("")}</select><div class="card" style="margin-top:8px">${W.map(row).join("")||`<p class="mu" style="padding:0 12px">Aucun exercice en attente.</p>`}</div>${D2.length?`${dt("xdone",false)}<summary>Terminés <span class="mu">· ${D2.length}</span></summary><div class="card">${D2.map(row).join("")}</div></details>`:""}`}
function vSuivi(){const ms=[...new Set([...S.log.map(e=>e.date.slice(0,7)),...S.ex.map(e=>e.date.slice(0,7)),iso(new Date()).slice(0,7)])].sort().reverse(),ar=Object.keys(S.arch).sort().reverse();
return `<h2>Suivi des élèves</h2><select onchange="sm=this.value;r()"><option value="">Tous les mois</option>${ms.map(m=>`<option value="${m}"${m===sm?" selected":""}>${MN(m)}${S.arch[m]?" · archivé":""}</option>`).join("")}</select><div style="height:8px"></div>${tbl(rowsFor(sm))}${sm?`<div class="btns"><button onclick="archive()">${S.arch[sm]?"Mettre à jour l’archive de ce mois":"Archiver ce mois"}</button></div>`:""}<h2>Archives mensuelles</h2>${ar.map(m=>`<details><summary>${MN(m)} <span class="mu">· archivé le ${dm(S.arch[m].at)}</span></summary>${tbl(S.arch[m].rows)}<div class="btns"><button class="bad" onclick="delArch('${m}')">${cf==="a"+m?"Confirmer ?":"Supprimer l’archive"}</button></div></details>`).join("")||`<p class="mu">Aucun mois archivé.</p>`}`}
function vEleves(){const n=s=>S.log.filter(e=>e.student===s).length+S.ex.filter(e=>e.student===s).length;
return `<h2>Élèves (${S.stu.length})</h2><p class="mu">Un seul nom par élève. Pour corriger une faute ou un doublon, renomme : si le nom existe déjà, les deux sont fusionnés. Supprimer un élève efface aussi ses séances et exercices.</p><div class="card">${[...S.stu].sort().map(s=>{const i=S.stu.indexOf(s);return `<div class="row"><input value="${esc(s)}" onchange="renStu(${i},this.value)"><small class="mu">${n(s)}</small><button class="x" onclick="delStu(${i})">${cf==="s"+i?"Confirmer ?":"✕"}</button></div>`}).join("")||`<p class="mu" style="padding:0 12px">Aucun élève.</p>`}</div><div class="add"><input id="ne" placeholder="Nouvel élève"><button class="pri" onclick="addStu()">Ajouter</button></div><div class="btns"><button onclick="impPlan()">Importer les noms du planning</button></div>`}
function addLog(){const s=canon($("le").value);if(!s)return;S.log.push({id:"l"+Date.now(),date:$("ld").value||iso(new Date()),student:s,sub:$("lm").value.trim(),c:$("lc").value.trim(),st:$("lt").value});cp=null;save();r()}
function addEx(){const s=canon($("xe").value),t=$("xt").value.trim();if(!s||!t)return;S.ex.push({id:"x"+Date.now(),student:s,sub:$("xm").value.trim(),t,date:iso(new Date()),due:$("xd").value,done:false});cp=null;save();r()}
function tgEx(id){const e=S.ex.find(x=>x.id===id);e.done=!e.done;save();r()}
function delEx(id){S.ex=S.ex.filter(x=>x.id!==id);save();r()}
function delLog(id){S.log=S.log.filter(x=>x.id!==id);save();r()}
function addStu(){const v=$("ne").value.trim();if(v){canon(v);save();r()}}
function impPlan(){S.plans.forEach(p=>Object.values(p.slots).forEach(v=>SN(v).forEach(canon)));save();r()}
function renStu(i,v){const o=S.stu[i];v=v.replace(/\s+/g," ").trim();if(!v||v===o)return;const j=S.stu.findIndex((x,k)=>k!==i&&nk(x)===nk(v)),nn=j>=0?S.stu[j]:v;S.log.concat(S.ex).forEach(e=>{if(e.student===o)e.student=nn});if(j>=0)S.stu.splice(i,1);else S.stu[i]=v;save();r()}
function delStu(i){const s=S.stu[i],c=S.log.some(e=>e.student===s)||S.ex.some(e=>e.student===s);if(c&&cf!=="s"+i){cf="s"+i;r();return}S.log=S.log.filter(e=>e.student!==s);S.ex=S.ex.filter(e=>e.student!==s);S.stu.splice(i,1);cf="";save();r()}
function fromLesson(i){cp={student:SN(TL[i].l).map(canon)[0]||"",date:iso(new Date())};tab="cahier";cv="s";r();scrollTo(0,0)}
function archive(){S.arch[sm]={at:iso(new Date()),rows:rowsFor(sm)};save();r()}
function delArch(m){if(cf!=="a"+m){cf="a"+m;r();return}delete S.arch[m];cf="";save();r()}
function hwToday(it){const t=iso(new Date()),ns=it.filter(x=>x.k==="cours").flatMap(x=>SN(x.l).map(nk)),p=S.ex.filter(e=>!e.done&&(e.due?e.due<=t:ns.includes(nk(e.student)))).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
return p.length?`<h2>Exercices à corriger</h2><div class="card">${p.map(e=>`<label class="row"><input type="checkbox" onchange="tgEx('${e.id}')"><span><b style="width:auto;color:inherit">${esc(e.student)}</b> · ${esc(e.t)} <small class="${e.due&&e.due<t?"late":"mu"}">${e.due?(e.due<t?"· en retard, prévu le "+dm(e.due):"· à corriger aujourd’hui"):"· donné le "+dm(e.date)}</small></span></label>`).join("")}</div>`:""}
function go(t){tab=t;cf="";cp=null;r();scrollTo(0,0)}
function r(){$("app").innerHTML={today:vToday,plan:vPlan,ag:vAgenda,cahier:vCahier,pay:vPay,tasks:vTasks}[tab]();tick();
$("nav").innerHTML=[["today","Accueil"],["plan","Planning"],["ag","Agenda"],["cahier","Cahier"],["pay","Paie"],["tasks","Tâches"]].map(x=>`<button class="${tab===x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
r();
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
